<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Alisha 💕</title>
  <style>
    /* ─────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08061A;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────────
       SHIMMER BACKGROUND — pure CSS sparkles
    ───────────────────────────────────────────── */
    @keyframes shimmerMove {
      0%   { background-position: 0% 0%; }
      50%  { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%       { opacity: 1; transform: scale(1.2); }
    }

    /* ─────────────────────────────────────────────
       MAIN OVERLAY
    ───────────────────────────────────────────── */
    #love-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(200, 120, 255, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(23, 196, 146, 0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(245, 166, 35, 0.04) 0%, transparent 60%),
        #08061A;
    }

    /* Animated shimmer overlay layer */
    #love-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        transparent 0%,
        rgba(245, 166, 35, 0.03) 20%,
        transparent 40%,
        rgba(255, 107, 157, 0.03) 60%,
        transparent 80%,
        rgba(201, 184, 255, 0.03) 100%
      );
      background-size: 400% 400%;
      animation: shimmerMove 8s ease-in-out infinite;
      pointer-events: none;
    }

    /* Star-sparkle pseudo-dots */
    #love-splash::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(245,166,35,0.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,107,157,0.5) 1px, transparent 1px),
        radial-gradient(circle, rgba(201,184,255,0.5) 1px, transparent 1px),
        radial-gradient(circle, rgba(23,196,146,0.4) 1px, transparent 1px),
        radial-gradient(circle, rgba(245,166,35,0.3) 1px, transparent 1px);
      background-size:
        250px 250px,
        370px 370px,
        430px 430px,
        290px 290px,
        310px 310px;
      background-position:
        40px 60px,
        130px 200px,
        80px 350px,
        300px 100px,
        200px 280px;
      animation: twinkle 3s ease-in-out infinite alternate;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ─────────────────────────────────────────────
       SKIP LINK — top right
    ───────────────────────────────────────────── */
    #skip-link {
      position: absolute;
      top: 20px;
      right: 28px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: rgba(201, 184, 255, 0.5);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.3s ease;
      z-index: 10;
      font-family: system-ui, sans-serif;
    }

    #skip-link:hover {
      color: rgba(201, 184, 255, 0.9);
    }

    /* ─────────────────────────────────────────────
       FLOATING HEARTS
    ───────────────────────────────────────────── */
    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) scale(0.4) rotate(25deg);
        opacity: 0;
      }
    }

    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 1.4rem;
      animation: floatHeart linear infinite;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 0 6px rgba(255, 107, 157, 0.8));
    }

    /* 18 hearts — varied positions, sizes, durations, delays */
    .heart:nth-child(1)  { left: 4%;   font-size: 1.1rem; animation-duration: 8s;  animation-delay: 0s;    }
    .heart:nth-child(2)  { left: 9%;   font-size: 1.5rem; animation-duration: 10s; animation-delay: 1.2s;  }
    .heart:nth-child(3)  { left: 16%;  font-size: 0.9rem; animation-duration: 7s;  animation-delay: 2.5s;  }
    .heart:nth-child(4)  { left: 23%;  font-size: 1.3rem; animation-duration: 11s; animation-delay: 0.7s;  }
    .heart:nth-child(5)  { left: 31%;  font-size: 1.0rem; animation-duration: 9s;  animation-delay: 3.1s;  }
    .heart:nth-child(6)  { left: 39%;  font-size: 1.6rem; animation-duration: 12s; animation-delay: 0.3s;  }
    .heart:nth-child(7)  { left: 46%;  font-size: 0.8rem; animation-duration: 8s;  animation-delay: 4.0s;  }
    .heart:nth-child(8)  { left: 53%;  font-size: 1.4rem; animation-duration: 10s; animation-delay: 1.8s;  }
    .heart:nth-child(9)  { left: 60%;  font-size: 1.2rem; animation-duration: 9s;  animation-delay: 2.9s;  }
    .heart:nth-child(10) { left: 67%;  font-size: 1.0rem; animation-duration: 7s;  animation-delay: 0.5s;  }
    .heart:nth-child(11) { left: 73%;  font-size: 1.5rem; animation-duration: 11s; animation-delay: 3.7s;  }
    .heart:nth-child(12) { left: 79%;  font-size: 0.9rem; animation-duration: 8s;  animation-delay: 1.4s;  }
    .heart:nth-child(13) { left: 85%;  font-size: 1.3rem; animation-duration: 10s; animation-delay: 2.2s;  }
    .heart:nth-child(14) { left: 91%;  font-size: 1.1rem; animation-duration: 9s;  animation-delay: 4.5s;  }
    .heart:nth-child(15) { left: 96%;  font-size: 0.8rem; animation-duration: 7s;  animation-delay: 0.9s;  }
    .heart:nth-child(16) { left: 13%;  font-size: 1.6rem; animation-duration: 13s; animation-delay: 5.0s;  }
    .heart:nth-child(17) { left: 57%;  font-size: 1.2rem; animation-duration: 8s;  animation-delay: 3.3s;  }
    .heart:nth-child(18) { left: 77%;  font-size: 1.0rem; animation-duration: 11s; animation-delay: 6.0s;  }

    /* ─────────────────────────────────────────────
       ROSE PETALS
    ───────────────────────────────────────────── */
    @keyframes petalFall {
      0% {
        transform: translateY(-60px) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.85;
      }
      85% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(110vh) rotate(360deg) translateX(40px);
        opacity: 0;
      }
    }

    .petal {
      position: absolute;
      top: -40px;
      width: 14px;
      height: 20px;
      border-radius: 150% 0 150% 0;
      background: linear-gradient(135deg, #FF6B9D, #E85D26);
      opacity: 0.8;
      animation: petalFall ease-in infinite;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 107, 157, 0.4);
    }

    .petal:nth-child(19)  { left: 7%;  width: 12px; height: 18px; animation-duration: 9s;  animation-delay: 0s;    }
    .petal:nth-child(20)  { left: 15%; width: 10px; height: 16px; animation-duration: 11s; animation-delay: 1.5s;  }
    .petal:nth-child(21)  { left: 25%; width: 14px; height: 20px; animation-duration: 8s;  animation-delay: 3.0s;  }
    .petal:nth-child(22)  { left: 35%; width: 11px; height: 17px; animation-duration: 12s; animation-delay: 0.8s;  }
    .petal:nth-child(23)  { left: 44%; width: 13px; height: 19px; animation-duration: 10s; animation-delay: 2.2s;  }
    .petal:nth-child(24)  { left: 54%; width: 9px;  height: 15px; animation-duration: 9s;  animation-delay: 4.0s;  }
    .petal:nth-child(25)  { left: 63%; width: 14px; height: 20px; animation-duration: 11s; animation-delay: 1.1s;  }
    .petal:nth-child(26)  { left: 72%; width: 12px; height: 18px; animation-duration: 8s;  animation-delay: 3.5s;  }
    .petal:nth-child(27)  { left: 82%; width: 10px; height: 16px; animation-duration: 13s; animation-delay: 0.4s;  }
    .petal:nth-child(28)  { left: 93%; width: 13px; height: 19px; animation-duration: 10s; animation-delay: 2.8s;  }

    /* ─────────────────────────────────────────────
       CONTENT CONTAINER
    ───────────────────────────────────────────── */
    .splash-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 720px;
      gap: 1.6rem;
    }

    /* ─────────────────────────────────────────────
       SEQUENTIAL FADE-IN ANIMATIONS
    ───────────────────────────────────────────── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.88);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .anim-1 { opacity: 0; animation: fadeInUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s forwards; }
    .anim-2 { opacity: 0; animation: fadeInUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.8s forwards; }
    .anim-3 { opacity: 0; animation: fadeInUp 0.9s cubic-bezier(0.22,1,0.36,1) 1.3s forwards; }
    .anim-4 { opacity: 0; animation: fadeInUp 0.9s cubic-bezier(0.22,1,0.36,1) 1.8s forwards; }
    .anim-5 { opacity: 0; animation: fadeInScale 0.9s cubic-bezier(0.22,1,0.36,1) 2.3s forwards; }

    /* ─────────────────────────────────────────────
       DECORATIVE DIVIDER
    ───────────────────────────────────────────── */
    .love-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
    }

    .love-divider::before,
    .love-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,166,35,0.4), transparent);
    }

    .love-divider-icon {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* ─────────────────────────────────────────────
       MAIN HEADING — "I Love You, Alisha"
    ───────────────────────────────────────────── */
    @keyframes glowPulse {
      0%, 100% { text-shadow:
        0 0 20px rgba(245,166,35,0.5),
        0 0 40px rgba(255,107,157,0.3),
        0 0 80px rgba(232,93,38,0.2); }
      50%       { text-shadow:
        0 0 30px rgba(245,166,35,0.8),
        0 0 60px rgba(255,107,157,0.5),
        0 0 120px rgba(232,93,38,0.35); }
    }

    .main-heading {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #F5A623 0%, #FF6B9D 55%, #C9B8FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation:
        fadeInUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s both,
        glowPulse 3s ease-in-out 1.5s infinite;
      /* glowPulse on text-fill-color doesn't apply to gradient text, so we use a wrapper glow */
    }

    /* Glow wrapper around heading */
    .heading-wrap {
      position: relative;
    }

    .heading-wrap::after {
      content: 'I Love You, Alisha 💕';
      position: absolute;
      inset: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #F5A623 0%, #FF6B9D 55%, #C9B8FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(18px);
      opacity: 0.55;
      pointer-events: none;
      animation: glowPulse 3s ease-in-out 1.5s infinite;
    }

    /* ─────────────────────────────────────────────
       SUBTEXT — romantic encouragement
    ───────────────────────────────────────────── */
    .sub-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.0rem, 2.8vw, 1.35rem);
      font-weight: 400;
      color: rgba(255, 220, 230, 0.88);
      line-height: 1.65;
      letter-spacing: 0.02em;
      max-width: 560px;
    }

    .sub-text .sparkle {
      display: inline-block;
      animation: twinkle 2s ease-in-out infinite;
    }

    /* ─────────────────────────────────────────────
       QUOTE
    ───────────────────────────────────────────── */
    .quote-block {
      position: relative;
      padding: 1.1rem 1.6rem;
      border-left: 2px solid rgba(23, 196, 146, 0.5);
      background: rgba(23, 196, 146, 0.05);
      border-radius: 0 12px 12px 0;
      max-width: 580px;
    }

    .quote-block::before {
      content: '"';
      position: absolute;
      top: -8px;
      left: 10px;
      font-size: 3.5rem;
      color: rgba(23, 196, 146, 0.25);
      font-family: Georgia, serif;
      line-height: 1;
    }

    .quote-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.9rem, 2.2vw, 1.1rem);
      color: #17C492;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    /* ─────────────────────────────────────────────
       SIGNATURE
    ───────────────────────────────────────────── */
    .signature {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      color: rgba(245, 166, 35, 0.7);
      letter-spacing: 0.04em;
    }

    /* ─────────────────────────────────────────────
       CTA BUTTON
    ───────────────────────────────────────────── */
    @keyframes buttonGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(245,166,35,0.3), 0 0 30px rgba(245,166,35,0.1); }
      50%       { box-shadow: 0 0 25px rgba(245,166,35,0.6), 0 0 50px rgba(232,93,38,0.25); }
    }

    @keyframes arrowDrift {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(5px); }
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0.85rem 2.2rem;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F5A623;
      background: transparent;
      border: 1.5px solid rgba(245, 166, 35, 0.6);
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.35s ease, border-color 0.35s ease;
      animation: buttonGlow 2.5s ease-in-out infinite;
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #F5A623, #E85D26);
      opacity: 0;
      transition: opacity 0.35s ease;
      border-radius: inherit;
    }

    .cta-btn:hover {
      color: #08061A;
      border-color: transparent;
    }

    .cta-btn:hover::before {
      opacity: 1;
    }

    .cta-btn span {
      position: relative;
      z-index: 1;
    }

    .cta-btn .btn-arrow {
      position: relative;
      z-index: 1;
      display: inline-block;
      animation: arrowDrift 1.5s ease-in-out infinite;
    }

    .cta-btn:active {
      transform: scale(0.97);
    }

    /* ─────────────────────────────────────────────
       RESPONSIVE TWEAKS
    ───────────────────────────────────────────── */
    @media (max-width: 480px) {
      .splash-content { gap: 1.2rem; padding: 1.5rem 1rem; }
      .quote-block { padding: 0.9rem 1.2rem; }
    }
  </style>
</head>
<body>
